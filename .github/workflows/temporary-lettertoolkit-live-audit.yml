name: Temporary LetterToolkit live audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install audit tools
        run: npm install --no-save cheerio@1.0.0 lighthouse@12.8.2 playwright-core@1.55.0

      - name: Audit live SEO, sitemap, endpoints and headers
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import * as cheerio from 'cheerio';

          const BASE='https://lettertoolkit.com';
          const failures=[]; const warnings=[]; const notes=[];
          const fail=m=>{failures.push(m); console.log('FAIL:',m)};
          const warn=m=>{warnings.push(m); console.log('WARN:',m)};
          const note=m=>{notes.push(m); console.log('NOTE:',m)};
          const norm=u=>{const x=new URL(u,BASE);x.hash='';if(x.pathname!=='/'&&!x.pathname.endsWith('/'))x.pathname+='/';return x.toString()};
          async function req(url,opts={}){const r=await fetch(url,{redirect:opts.redirect??'follow',signal:AbortSignal.timeout(30000),headers:{'user-agent':opts.ua??'Mozilla/5.0 LetterToolkitAudit/1.0',accept:opts.accept??'*/*'}});const t=opts.body===false?'':await r.text();return {r,t}}

          console.log('=== redirects ===');
          for(const source of ['http://lettertoolkit.com/','https://www.lettertoolkit.com/','http://www.lettertoolkit.com/']){
            try{const {r}=await req(source,{redirect:'manual',body:false});const loc=r.headers.get('location')||'';console.log(source,r.status,loc);if(![301,302,307,308].includes(r.status))fail(`${source} returns ${r.status} instead of redirect`);else if(!loc.startsWith(BASE))fail(`${source} redirects to non-canonical host ${loc}`)}catch(e){fail(`${source}: ${e.message}`)}
          }

          console.log('=== endpoints ===');
          const endpoints=['/robots.txt','/sitemap.xml','/ads.txt','/assets/favicon.svg','/favicon.ico','/manifest.webmanifest','/styles.css?v=4.0.1','/app.js?v=4.0.1','/words.txt'];
          const bodies={};
          for(const p of endpoints){try{const {r,t}=await req(BASE+p);bodies[p]=t;console.log(p,r.status,r.headers.get('content-type')||'',t.length);if(['/robots.txt','/sitemap.xml','/ads.txt','/assets/favicon.svg','/styles.css?v=4.0.1','/app.js?v=4.0.1','/words.txt'].includes(p)&&r.status!==200)fail(`${p} returned ${r.status}`);if(['/favicon.ico','/manifest.webmanifest'].includes(p)&&r.status!==200)warn(`${p} returned ${r.status}`)}catch(e){warn(`${p}: ${e.message}`)}}
          const robots=bodies['/robots.txt']||''; if(!/User-agent:\s*\*/i.test(robots))fail('robots missing wildcard user-agent'); if(/^\s*Disallow:\s*\/\s*$/im.test(robots))fail('robots blocks whole site'); if(!/Sitemap:\s*https:\/\/lettertoolkit\.com\/sitemap\.xml/i.test(robots))fail('robots missing canonical sitemap'); if(/Content-Signal:/i.test(robots))note('Cloudflare Content-Signal present');
          const ads=bodies['/ads.txt']||''; if(!/google\.com\s*,\s*pub-9212084765206199\s*,\s*DIRECT\s*,\s*f08c47fec0942fa0/i.test(ads))fail('ads.txt missing authorized seller line');

          const sm=bodies['/sitemap.xml']||''; const urls=[...sm.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m=>m[1].trim()); console.log('sitemap urls',urls.length); if(!urls.length)fail('empty sitemap'); if(new Set(urls).size!==urls.length)fail('duplicate sitemap URLs');
          const titles=new Map(), descs=new Map();
          let cursor=0; async function worker(){while(cursor<urls.length){const u=urls[cursor++];try{const {r,t}=await req(u,{accept:'text/html'});const $=cheerio.load(t);const title=$('title').first().text().trim();const desc=$('meta[name="description"]').attr('content')?.trim()||'';const can=$('link[rel="canonical"]').attr('href')||'';const robotsMeta=$('meta[name="robots"]').attr('content')||'';const h1=$('h1').length;const og=$('meta[property="og:title"]').attr('content')||'';const jsonld=$('script[type="application/ld+json"]').length;console.log(r.status,u,'h1',h1,'title',title.length,'desc',desc.length,'og',!!og,'jsonld',jsonld);if(r.status!==200)fail(`${u} returned ${r.status}`);if(!title)fail(`${u} no title`);if(!desc)fail(`${u} no description`);if(!can)fail(`${u} no canonical`);else if(norm(can)!==norm(u))fail(`${u} canonical ${can}`);if(/noindex/i.test(robotsMeta))fail(`${u} noindex in sitemap`);if(h1!==1)fail(`${u} has ${h1} H1`);if(!og)warn(`${u} missing Open Graph`);if(jsonld===0)warn(`${u} missing JSON-LD`);if(title.length>70)warn(`${u} long title ${title.length}`);if(desc.length<70)warn(`${u} short description ${desc.length}`);titles.set(title,[...(titles.get(title)||[]),u]);descs.set(desc,[...(descs.get(desc)||[]),u]);}catch(e){fail(`${u}: ${e.message}`)}}}
          await Promise.all(Array.from({length:8},worker));
          for(const [t,us] of titles)if(t&&us.length>1)fail(`duplicate title: ${t} -> ${us.join(', ')}`);
          for(const [d,us] of descs)if(d&&us.length>1)warn(`duplicate description on ${us.length} pages`);

          console.log('=== repo coverage ===');
          function walk(d){return fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{if(['.git','node_modules'].includes(e.name))return[];const f=path.join(d,e.name);return e.isDirectory()?walk(f):[f]})}
          const html=walk('.').filter(f=>f==='index.html'||f.endsWith('/index.html')); console.log('html files',html.length); if(html.length!==urls.length)warn(`repo has ${html.length} HTML routes vs ${urls.length} sitemap URLs`);

          console.log('=== headers ===');
          const {r:hr}=await req(BASE+'/',{body:false}); for(const h of ['strict-transport-security','x-content-type-options','referrer-policy','permissions-policy','x-frame-options','cache-control']){const v=hr.headers.get(h);console.log(h,v||'MISSING');if(!v)warn(`missing ${h}`)}

          fs.writeFileSync('/tmp/lettertoolkit-audit.json',JSON.stringify({failures,warnings,notes,sitemapCount:urls.length},null,2));
          console.log('SUMMARY failures',failures.length,'warnings',warnings.length,'notes',notes.length);
          NODE

      - name: Test homepage dark mode and representative pages
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import {chromium} from 'playwright-core';
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']});
          const findings=[]; const results=[];
          async function inspect(path,width){const ctx=await browser.newContext({viewport:{width,height:900}});const page=await ctx.newPage();const consoleMsgs=[];const failed=[];page.on('console',m=>{if(['error','warning'].includes(m.type()))consoleMsgs.push(`${m.type()}: ${m.text()}`)});page.on('pageerror',e=>consoleMsgs.push('pageerror: '+e.message));page.on('requestfailed',r=>failed.push(`${r.failure()?.errorText||'failed'} ${r.url()}`));const resp=await page.goto('https://lettertoolkit.com'+path,{waitUntil:'domcontentloaded',timeout:60000});await page.waitForTimeout(2500);const state=await page.evaluate(()=>({title:document.title,h1:document.querySelectorAll('h1').length,client:document.documentElement.clientWidth,scroll:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth),bodyBg:getComputedStyle(document.body).backgroundColor,theme:document.documentElement.dataset.theme||'',toggle:document.querySelector('#themeToggle')?.textContent||'',mainVisible:!!document.querySelector('main')&&document.querySelector('main').getBoundingClientRect().height>0}));console.log(path,width,resp?.status(),JSON.stringify(state),'console',consoleMsgs.length,'failed',failed.length);if(resp?.status()!==200)findings.push(`${path} ${width}px status ${resp?.status()}`);if(state.h1!==1)findings.push(`${path} ${width}px h1 ${state.h1}`);if(state.scroll>state.client+1)findings.push(`${path} ${width}px overflow ${state.scroll-state.client}`);if(!state.mainVisible)findings.push(`${path} ${width}px no visible main`);const firstParty=failed.filter(x=>/lettertoolkit\.com/.test(x));if(firstParty.length)findings.push(`${path} ${width}px first-party failed requests ${firstParty.length}`);results.push({path,width,state,consoleMsgs,failed});await ctx.close()}
          for(const p of ['/','/word-unscrambler/','/word-finder/','/anagram-solver/','/crossword-solver/','/wordle-helper/','/writer/','/cv-builder/','/guides/','/about/']){await inspect(p,390);await inspect(p,1365)}

          const ctx=await browser.newContext({viewport:{width:1365,height:900}});const page=await ctx.newPage();const errors=[];page.on('pageerror',e=>errors.push(e.message));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});await page.goto('https://lettertoolkit.com/',{waitUntil:'domcontentloaded',timeout:60000});await page.waitForTimeout(1000);const before=await page.evaluate(()=>({theme:document.documentElement.dataset.theme||'',text:document.querySelector('#themeToggle')?.textContent||'',bg:getComputedStyle(document.body).backgroundColor}));let clickError='';try{await page.click('#themeToggle');await page.waitForTimeout(300)}catch(e){clickError=e.message}const after=await page.evaluate(()=>({theme:document.documentElement.dataset.theme||'',text:document.querySelector('#themeToggle')?.textContent||'',bg:getComputedStyle(document.body).backgroundColor,stored:localStorage.getItem('lt-theme')}));console.log('DARK MODE before',JSON.stringify(before),'after',JSON.stringify(after),'clickError',clickError,'errors',errors);if(after.theme!=='dark'||after.stored!=='dark'||before.bg===after.bg)findings.push('homepage dark mode toggle is not functioning');await page.reload({waitUntil:'domcontentloaded'});await page.waitForTimeout(500);const persisted=await page.evaluate(()=>({theme:document.documentElement.dataset.theme||'',text:document.querySelector('#themeToggle')?.textContent||'',stored:localStorage.getItem('lt-theme')}));console.log('DARK MODE persisted',JSON.stringify(persisted));if(persisted.theme!=='dark')findings.push('dark mode preference does not persist after reload');await ctx.close();await browser.close();fs.writeFileSync('/tmp/lettertoolkit-browser.json',JSON.stringify({findings,results},null,2));console.log('FINDINGS',findings.length);for(const f of findings)console.log('FINDING:',f);
          NODE

      - name: Lighthouse homepage and core tool
        run: |
          for target in home tool; do
            if [ "$target" = home ]; then URL='https://lettertoolkit.com/'; else URL='https://lettertoolkit.com/word-unscrambler/'; fi
            npx lighthouse "$URL" --output=json --output-path="/tmp/lettertoolkit-$target.json" --only-categories=performance,accessibility,best-practices,seo --chrome-flags="--headless --no-sandbox --disable-gpu --disable-dev-shm-usage" --quiet || true
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';for(const t of ['home','tool']){const f=`/tmp/lettertoolkit-${t}.json`;if(!fs.existsSync(f))continue;const r=JSON.parse(fs.readFileSync(f,'utf8'));const s=n=>Math.round((r.categories[n]?.score||0)*100);console.log(t,{performance:s('performance'),accessibility:s('accessibility'),'best-practices':s('best-practices'),seo:s('seo')});for(const id of ['first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','render-blocking-resources','errors-in-console','robots-txt']){const a=r.audits[id];if(a)console.log(id,a.score,a.displayValue||a.numericValue||'',JSON.stringify((a.details?.items||[]).slice(0,5)))}}
          NODE
