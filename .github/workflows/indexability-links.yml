name: Indexability and internal links

on:
  workflow_dispatch:
  push:
    branches: [main, seo-growth-phases33-39-20260828]
    paths:
      - '**/index.html'
      - 'sitemap*.xml'
      - 'scripts/check-indexability-links.cjs'
      - 'scripts/check-promoted-search-pages.cjs'
      - '.github/workflows/indexability-links.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit indexability and internal links
        run: node scripts/check-indexability-links.cjs
      - name: Guard promoted Search Console pages
        run: node scripts/check-promoted-search-pages.cjs
